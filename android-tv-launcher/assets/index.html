<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, user-scalable=no">
<title>Inicio TV</title>
<style>
  :root {
    --glass: rgba(255,255,255,.14);
    --glass-border: rgba(255,255,255,.38);
    --text: rgba(255,255,255,.95);
    --text-soft: rgba(255,255,255,.75);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0d1a20; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, "SF Pro Display", Roboto, sans-serif;
    color: var(--text);
    -webkit-user-select: none; user-select: none;
  }

  /* Lienzo fijo 1920x1080, escalado a la pantalla */
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    overflow: hidden;
  }
  #wallpaper { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; }
  #frente { position: absolute; top: 0; left: 0; width: 1920px; height: 560px; }
  #shade {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 55%, rgba(0,0,0,.3) 100%);
  }

  .glass {
    background: var(--glass);
    border: 1.5px solid var(--glass-border);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 10px 30px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.35);
  }

  #status { position: absolute; top: 48px; right: 56px; display: flex; gap: 16px; z-index: 3; }
  .pill {
    height: 60px; padding: 0 24px; border-radius: 30px;
    display: flex; align-items: center;
    font-size: 24px; font-weight: 500;
  }
  .pill svg { width: 30px; height: 30px; margin-right: 12px; }
  /* Oscuro como la hora: el cristal blanco se perdía sobre el cielo claro */
  #wifi {
    background: rgba(15,47,69,.78); color: #fff;
    font-family: "Nunito", sans-serif; font-weight: 800; font-size: 26px;
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
  }
  #wifi.off { background: rgba(170,40,40,.85); }
  #bt { background: rgba(15,47,69,.78); color: #fff; font-family: "Nunito", sans-serif; font-weight: 800; font-size: 26px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  #bt.off { background: rgba(70,80,90,.7); }
  #bt { margin-left: 16px; }   /* WebView 83 no tiene gap en flex */
  #status .pill.focus { transform: scale(1.05); box-shadow: 0 0 0 3px rgba(255,255,255,.95), 0 10px 24px rgba(0,0,0,.35); }
  .pill { max-width: 360px; }
  .pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Nunito: letra redondeada para la fecha y la hora */
  @font-face { font-family: "Nunito"; font-weight: 800; src: url("nunito-800.woff2") format("woff2"); }
  #date {
    position: absolute; top: 126px; width: 100%; text-align: center;
    font-family: "Nunito", sans-serif;
    font-size: 42px; font-weight: 800; letter-spacing: .5px;
    color: #0f2f45;
    text-shadow: 0 1px 10px rgba(255,255,255,.45);
  }
  /* Oscuro y grueso: el blanco fino se perdía al proyectar sobre pared blanca.
     Queda detrás de #frente, así las montañas tapan la parte de abajo */
  #clock {
    position: absolute; top: 168px; width: 100%; text-align: center;
    font-family: "Nunito", sans-serif;
    font-size: 270px; font-weight: 800; letter-spacing: -2px; line-height: 1;
    color: #0f2f45;
    text-shadow: 0 2px 30px rgba(255,255,255,.4);
    font-variant-numeric: tabular-nums;
  }

  .row { position: absolute; left: 0; width: 100%; display: flex; justify-content: center; }
  #apps { top: 610px; align-items: center; }
  #apps > .tile + .tile { margin-left: 30px; }
  #quick { top: 830px; }
  #quick > .tile + .tile { margin-left: 26px; }

  .tile {
    position: relative; cursor: pointer; outline: none;
    transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s;
  }
  .tile.focus {
    transform: scale(1.1);
    box-shadow: 0 0 0 4px rgba(255,255,255,.95), 0 22px 50px rgba(0,0,0,.4);
    z-index: 2;
  }

  .app {
    width: 260px; height: 146px; border-radius: 28px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(0,0,0,.28);
  }
  .app::after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: inherit;
    background: linear-gradient(160deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 42%);
    pointer-events: none;
  }
  .app.square { width: 146px; color: var(--text); }
  .app.square svg { width: 52px; height: 52px; }

  .yt { background: #fff; color: #0f0f0f; font-size: 40px; font-weight: 700; letter-spacing: -1.5px; }
  .yt .logo { margin-right: 12px; width: 62px; height: 44px; background: #ff0033; border-radius: 12px; display: grid; place-items: center; }
  .nf { background: #000; color: #e50914; font-family: "Arial Black", Impact, sans-serif; font-weight: 900; font-size: 46px; letter-spacing: 1px; }
  .jf svg { margin-right: 12px; }
  .iptv { background: linear-gradient(135deg, #f7971e, #e8453c); color: #fff; font-size: 44px; font-weight: 800; letter-spacing: 1px; }
  .iptv svg { margin-right: 14px; }
  .jf { background: linear-gradient(135deg, #aa5cc3, #00a4dc); color: #fff; font-size: 42px; font-weight: 600; letter-spacing: -1px; }

  .qs {
    width: 200px; height: 104px; border-radius: 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 21px; color: var(--text-soft); font-weight: 500;
  }
  .qs svg { margin-bottom: 8px; width: 34px; height: 34px; color: var(--text); }

  /* Todas las apps */
  #drawer {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none;
    background: rgba(9,16,20,.98);
    overflow-y: auto; scrollbar-width: none;
    padding: 90px 0 120px;
    z-index: 50;
  }
  #drawer::-webkit-scrollbar { display: none; }
  #drawer.open { display: block; }
  #drawer h2 { font-size: 46px; font-weight: 600; text-align: center; margin-bottom: 50px; }
  #grid { display: grid; grid-template-columns: repeat(6, 250px); gap: 40px 34px; justify-content: center; }
  .dapp {
    height: 141px; border-radius: 24px; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 21px; font-weight: 500; text-align: center; padding: 0 12px;
    background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.18);
  }
  .dapp img.icon { width: 72px; height: 72px; margin-bottom: 10px; }
  .dapp img.banner { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; object-fit: cover; }
  .dapp span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  #empty { text-align: center; font-size: 28px; color: var(--text-soft); }

  #toast {
    position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%) translateY(20px);
    padding: 18px 34px; border-radius: 40px; font-size: 26px; font-weight: 500;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 10;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="stage">
  <img id="wallpaper" src="fondo.jpg" alt="">
  <div id="shade"></div>

  <div id="status">
    <div class="pill tile" id="wifi" data-name="Wi‑Fi" data-action="android.settings.WIFI_SETTINGS">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16.2a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1.2" fill="currentColor"/></svg>
      <span id="wifi-text">Conectado</span>
    </div>
    <div class="pill tile" id="bt" data-name="Bluetooth" data-component="com.android.tv.settings/.accessories.AddAccessoryActivity" data-action="android.settings.BLUETOOTH_SETTINGS">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg>
      <span id="bt-text">Bluetooth</span>
    </div>
  </div>

  <div id="clock">00:00</div>
  <!-- Montañas recortadas del fondo (tools/recortar-montanas.ps1): tapan la parte baja de la hora -->
  <img id="frente" src="frente.png" alt="">
  <div id="date"></div>

  <div class="row" id="apps">
    <div class="tile app jf" data-name="Jellyfin" data-pkgs="org.jellyfin.androidtv,org.jellyfin.mobile"><svg width="40" height="40" viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5c-1.6 0-7 9.8-6.2 11.4.8 1.6 11.6 1.6 12.4 0C19 12.3 13.6 2.5 12 2.5zm0 4.2c1 0 4 5.6 3.6 6.5-.5.9-6.7.9-7.2 0C8 12.3 11 6.7 12 6.7z"/></svg>jellyfin</div>
    <div class="tile app nf" data-name="Netflix" data-pkgs="com.netflix.ninja,com.netflix.mediaclient">NETFLIX</div>
    <div class="tile app iptv" data-name="IPTV Smarters" data-pkgs="com.nst.iptvsmarterstvbox"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M8 2.5l4 3.5 4-3.5"/><path d="M10 10l4.5 2.5L10 15z" fill="#fff"/></svg>IPTV</div>
    <div class="tile app yt" data-name="YouTube" data-pkgs="com.google.android.youtube.tv,com.google.android.youtube,com.teamsmart.videomanager.tv"><span class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M7 4l14 8-14 8z"/></svg></span>YouTube</div>
    <div class="tile app square glass" data-name="Todas las apps" data-action="drawer">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></svg>
    </div>
    <div class="tile app square glass" data-name="Ajustes" data-action="android.settings.SETTINGS">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </div>
  </div>

  <!-- Se prueba en orden: data-component (pantalla de la marca), data-pkgs (app de la tele) y data-action (ajuste estándar) -->
  <div class="row" id="quick">
    <div class="tile qs glass" data-name="Entradas" data-component="com.tcl.sourcemananger/com.tcl.sourcemanager.MainActivity" data-pkgs="com.google.android.tv,com.android.tv,com.mediatek.wwtv.tvcenter,com.sony.dtv.tvx,com.tcl.tv,com.xiaomi.mitv.tvplayer,org.droidtv.playtv" data-action="android.settings.SETTINGS">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5M4 12h11M11 8l4 4-4 4"/></svg>Entradas
    </div>
    <div class="tile qs glass" data-name="Imagen" data-action="android.settings.DISPLAY_SETTINGS">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M9 21h6M12 17v4"/></svg>Imagen
    </div>
    <div class="tile qs glass" data-name="Reposo" data-action="screensaver">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 15.3A8.5 8.5 0 0 1 8.7 4a8.5 8.5 0 1 0 11.3 11.3z"/></svg>Reposo
    </div>
    <div class="tile qs glass" data-name="Ajustes" data-action="android.settings.SETTINGS">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Ajustes
    </div>
  </div>

  <div id="drawer">
    <h2>Todas las apps</h2>
    <div id="grid"></div>
  </div>

  <div id="toast" class="glass"></div>
</div>

<script>
  const Native = window.Android || null;
  const stage = document.getElementById('stage');
  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  addEventListener('resize', fit); addEventListener('load', fit); fit();
  // En el WebView la ventana puede medir 0 al arrancar: reintentar hasta tener tamaño
  (function waitSize() { if (!innerWidth || !innerHeight) requestAnimationFrame(waitSize); else fit(); })();

  function tick() {
    const now = new Date();
    const d = now.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
    document.getElementById('date').textContent = d.charAt(0).toUpperCase() + d.slice(1);
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  }
  tick(); setInterval(tick, 1000);

  // Botones de arriba: nombre de la red Wi‑Fi y aparato Bluetooth conectado (los da Android.netStatus)
  function updateNet() {
    let st = null;
    try { st = (window.Android && Android.netStatus) ? JSON.parse(Android.netStatus()) : null; } catch (e) {}
    const wifiEl = document.getElementById('wifi');
    const wifiTxt = document.getElementById('wifi-text');
    const btEl = document.getElementById('bt');
    const btTxt = document.getElementById('bt-text');
    if (st) {
      wifiEl.classList.toggle('off', !st.online);
      wifiTxt.textContent = st.online ? (st.ssid || 'Conectado') : 'Sin conexión';
      btEl.classList.toggle('off', !st.btOn);
      btTxt.textContent = st.btOn ? (st.bt || 'Bluetooth') : 'Bluetooth';
    } else {
      const on = navigator.onLine;
      wifiEl.classList.toggle('off', !on);
      wifiTxt.textContent = on ? 'Conectado' : 'Sin conexión';
    }
  }
  addEventListener('online', updateNet); addEventListener('offline', updateNet); updateNet();
  setInterval(updateNet, 8000);

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }

  // --- Pantalla principal ---
  // Fila 0: botones de Wi‑Fi y Bluetooth de arriba; se empieza en la fila de apps
  const rows = [
    [...document.querySelectorAll('#status .tile')],
    ...[...document.querySelectorAll('.row')].map(r => [...r.querySelectorAll('.tile')])
  ];
  let r = 1, c = 0;
  function focusHome() {
    document.querySelectorAll('.tile.focus').forEach(t => t.classList.remove('focus'));
    rows[r][c].classList.add('focus');
  }

  function activate(tile) {
    const action = tile.dataset.action;
    if (action === 'drawer') return openDrawer();
    if (!Native) return toast('Abriendo ' + tile.dataset.name + '…');
    if (action === 'screensaver') return Native.screensaver();
    if (tile.dataset.component && tile.dataset.component.split(',').some(cmp => Native.component(cmp))) return;
    if (tile.dataset.pkgs && Native.launch(tile.dataset.pkgs)) return;
    if (action) return Native.settings(action);
    if (tile.dataset.pkgs) toast(tile.dataset.name + ' no está instalada');
  }

  // --- Todas las apps ---
  const drawer = document.getElementById('drawer');
  const grid = document.getElementById('grid');
  const COLS = 6;
  let dTiles = [], di = 0;

  function demoApps() {
    return ['Ajustes', 'Disney+', 'Jellyfin', 'Max', 'Netflix', 'Prime Video', 'Spotify', 'YouTube']
      .map(label => ({ label, pkg: label, img: '', wide: false }));
  }

  function openDrawer() {
    let apps = [];
    try { apps = Native ? JSON.parse(Native.apps()) : demoApps(); } catch (e) {}
    grid.innerHTML = '';
    for (const a of apps) {
      const el = document.createElement('div');
      el.className = 'tile dapp';
      el.dataset.pkg = a.pkg;
      el.dataset.name = a.label;
      if (a.img && a.wide) {
        el.innerHTML = '<img class="banner" alt="">';
        el.firstChild.src = a.img;
      } else {
        if (a.img) { const img = document.createElement('img'); img.className = 'icon'; img.src = a.img; el.appendChild(img); }
        const span = document.createElement('span'); span.textContent = a.label; el.appendChild(span);
      }
      grid.appendChild(el);
    }
    dTiles = [...grid.children];
    dTiles.forEach((t, i) => {
      t.addEventListener('mouseenter', () => { di = i; focusDrawer(); });
      t.addEventListener('click', () => launchFromDrawer(t));
    });
    if (!dTiles.length) grid.innerHTML = '<p id="empty">No se encontraron apps</p>';
    di = 0;
    drawer.classList.add('open');
    drawer.scrollTop = 0;
    focusDrawer();
  }
  function closeDrawer() { drawer.classList.remove('open'); focusHome(); }
  function focusDrawer() {
    document.querySelectorAll('.tile.focus').forEach(t => t.classList.remove('focus'));
    const t = dTiles[di];
    if (!t) return;
    t.classList.add('focus');
    t.scrollIntoView({ block: 'nearest' });
  }
  function launchFromDrawer(t) {
    if (!Native) return toast('Abriendo ' + t.dataset.name + '…');
    if (!Native.launch(t.dataset.pkg)) toast('No se pudo abrir ' + t.dataset.name);
  }

  // --- Mando a distancia (Android llama a onRemote; en el navegador, las flechas) ---
  window.onRemote = function (k) {
    if (drawer.classList.contains('open')) {
      const n = dTiles.length;
      if (k === 'back') return closeDrawer();
      if (!n) return;
      if (k === 'right') di = Math.min(di + 1, n - 1);
      else if (k === 'left') di = Math.max(di - 1, 0);
      else if (k === 'down') di = Math.min(di + COLS, n - 1);
      else if (k === 'up') di = Math.max(di - COLS, 0);
      else if (k === 'enter') return launchFromDrawer(dTiles[di]);
      return focusDrawer();
    }
    if (k === 'right') c = Math.min(c + 1, rows[r].length - 1);
    else if (k === 'left') c = Math.max(c - 1, 0);
    else if (k === 'down' && r < rows.length - 1) { r++; c = Math.min(c, rows[r].length - 1); }
    else if (k === 'up' && r > 0) { r--; c = Math.min(c, rows[r].length - 1); }
    else if (k === 'enter') return activate(rows[r][c]);
    focusHome();
  };
  window.onResumeHome = function () {
    tick(); updateNet();
    if (drawer.classList.contains('open')) closeDrawer();
  };

  const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', Enter: 'enter', Escape: 'back', Backspace: 'back' };
  addEventListener('keydown', e => {
    const k = KEYS[e.key];
    if (!k) return;
    e.preventDefault();
    onRemote(k);
  });
  rows.forEach((row, ri) => row.forEach((tile, ci) => {
    tile.addEventListener('mouseenter', () => { r = ri; c = ci; focusHome(); });
    tile.addEventListener('click', () => activate(tile));
  }));
  focusHome();
</script>
</body>
</html>
